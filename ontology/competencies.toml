[[competencies]]
id = "programming.variables-and-expressions"
domain = "programming"
label = "Use variables and expressions"
description = "Define values and combine them in expressions in a programming language."
assessment_examples = ["Compute a derived value from several input values."]

[[competencies]]
id = "programming.control-flow"
domain = "programming"
label = "Use selection and iteration"
description = "Use conditional and loop constructs to control how a program processes data."
assessment_examples = ["Classify values with a conditional and aggregate values with a loop."]

[[competencies]]
id = "programming.functions"
domain = "programming"
label = "Write and call functions"
description = "Define a function or procedure with inputs and a result, and call it from other code."
assessment_examples = ["Write a function that computes the average of a collection of numbers."]

[[competencies]]
id = "programming.basic-data-structures"
domain = "programming"
label = "Use basic data structures"
description = "Store and retrieve values in sequence, mapping, set, or record-like data structures."
assessment_examples = ["Build a mapping from names to values and retrieve one value by key."]

[[competencies]]
id = "programming.program-decomposition"
domain = "programming"
label = "Decompose a program"
description = "Split a small problem into helper functions, procedures, modules, or files with distinct responsibilities."
assessment_examples = ["Split a small program into a few helper functions or files."]

[[competencies]]
id = "programming.read-and-trace-code"
domain = "programming"
label = "Read and trace code"
description = "Read a short program and explain its control flow, data flow, and result."
assessment_examples = ["Explain what a short program does without executing it line by line."]

[[competencies]]
id = "programming.text-file-io"
domain = "programming"
label = "Read and write text files"
description = "Read structured or unstructured text input and write or print a derived result."
assessment_examples = ["Read values from a text file and print a small summary."]

[[competencies]]
id = "programming.handle-invalid-input"
domain = "programming"
label = "Handle invalid input"
description = "Detect a missing or invalid input and respond without an uncontrolled program failure."
assessment_examples = ["Handle a missing value or invalid record and report the problem."]

[[competencies]]
id = "programming.modify-and-rerun"
domain = "programming"
label = "Modify and rerun a program"
description = "Make a small, deliberate change to existing code and execute or rebuild it to inspect the effect."
assessment_examples = ["Change one expression in an existing program and run it again."]

[[competencies]]
id = "command-line.navigate-filesystem"
domain = "command-line"
label = "Navigate a filesystem from a terminal"
description = "Locate and move between project directories using a shell or command prompt."
assessment_examples = ["Open a terminal and move to the directory containing a project's files."]

[[competencies]]
id = "command-line.manage-files"
domain = "command-line"
label = "Manage files from a terminal"
description = "Create, organize, edit, and inspect ordinary files from a command-line environment."
assessment_examples = ["Create a directory, edit a text file in it, and inspect the saved file."]

[[competencies]]
id = "command-line.run-or-compile-programs"
domain = "command-line"
label = "Run or compile programs from a terminal"
description = "Invoke an interpreter, executable, compiler, or build command and inspect its output."
assessment_examples = ["Compile or run a small program from its project directory."]

[[competencies]]
id = "shell.edit-run-inspect"
domain = "shell"
label = "Edit, run, and inspect in a shell"
description = "Use the shell workflow of editing a file, running a command, and inspecting its output."
assessment_examples = ["Make a small change to a script or command, rerun it, and inspect the result."]

[[competencies]]
id = "shell.read-and-adapt-scripts"
domain = "shell"
label = "Read and adapt shell scripts"
description = "Identify the inputs, outputs, and main commands in a short shell script and make a small change."
assessment_examples = ["Change an input path or command option in a short Bash script."]

[[competencies]]
id = "diagnostics.locate-problem"
domain = "diagnostics"
label = "Locate a problem from diagnostics"
description = "Use a compiler message, traceback, runtime error, or test failure to identify where a problem probably occurred."
assessment_examples = ["Read a short diagnostic and identify the source location needing attention."]

[[competencies]]
id = "python.run-code"
domain = "python"
label = "Run Python code"
description = "Execute Python in a script, notebook, or command-line environment and inspect the result."
assessment_examples = ["Run a Python script or notebook cell and inspect its output."]

[[competencies]]
id = "python.values-and-containers"
domain = "python"
label = "Use Python values and containers"
description = "Create and use Python numbers, strings, booleans, lists, tuples, sets, and dictionaries as appropriate."
assessment_examples = ["Build a dictionary and retrieve a stored value by key."]

[[competencies]]
id = "python.control-flow-and-comprehensions"
domain = "python"
label = "Use Python control flow and comprehensions"
description = "Use Python conditionals, loops, and simple comprehensions to transform or filter data."
assessment_examples = ["Filter a sequence with a loop or comprehension and a conditional."]

[[competencies]]
id = "python.functions"
domain = "python"
label = "Write and call Python functions"
description = "Define and call Python functions with arguments and return values."
assessment_examples = ["Write a function that transforms an input value and returns the result."]

[[competencies]]
id = "python.import-modules"
domain = "python"
label = "Import and use Python modules"
description = "Import a module and use functions, classes, or constants from it."
assessment_examples = ["Import a standard-library module and call one of its functions."]

[[competencies]]
id = "python.index-and-slice-sequences"
domain = "python"
label = "Index and slice Python sequences"
description = "Select individual values or subsequences using Python indexing and slicing syntax."
assessment_examples = ["Extract every second element from a sequence."]

[[competencies]]
id = "python.file-io"
domain = "python"
label = "Read and write files with Python"
description = "Open a small text file in Python, process its contents, and optionally write a result."
assessment_examples = ["Write a function that reads a text file and counts its lines."]

[[competencies]]
id = "python.exceptions"
domain = "python"
label = "Handle Python exceptions"
description = "Use try/except to handle an expected error such as a missing file or invalid value."
assessment_examples = ["Catch and handle a missing input file."]

[[competencies]]
id = "python.paths-and-file-names"
domain = "python"
label = "Work with paths and file names in Python"
description = "Construct, inspect, and transform basic filesystem paths and file names in Python."
assessment_examples = ["Build an output path from a directory, stem, and file extension."]

[[competencies]]
id = "python.activate-software-environment"
domain = "python"
label = "Activate a Python software environment"
description = "Activate a prepared Python environment and verify that an installed package can be imported."
assessment_examples = ["Activate an environment and import one of its installed packages."]

[[competencies]]
id = "python.simple-classes"
domain = "python"
label = "Define and use simple Python classes"
description = "Define a class with initialization, instance attributes, and methods, and create an instance."
assessment_examples = ["Define a small class with an initializer and one additional method."]

[[competencies]]
id = "numpy.create-slice-and-reshape-arrays"
domain = "numpy"
label = "Create, slice, and reshape NumPy arrays"
description = "Create a NumPy array and select or reshape its data while reasoning about the resulting shape."
assessment_examples = ["Create an array, take a slice, reshape it, and state the resulting shape."]

[[competencies]]
id = "numpy.vectorized-computations"
domain = "numpy"
label = "Apply vectorized NumPy computations"
description = "Apply element-wise numerical operations to arrays without an explicit Python loop."
assessment_examples = ["Apply a mathematical formula to every element of an array."]

[[competencies]]
id = "numpy.broadcasting"
domain = "numpy"
label = "Use NumPy broadcasting"
description = "Predict and use compatible array shapes in a broadcasted NumPy operation."
assessment_examples = ["Add a one-dimensional array to compatible rows or columns of a two-dimensional array."]

[[competencies]]
id = "numpy.reductions"
domain = "numpy"
label = "Compute NumPy reductions"
description = "Compute and interpret aggregate values such as sums, means, minima, or maxima over an array or axis."
assessment_examples = ["Compute a mean over a selected axis and state the result's shape."]

[[competencies]]
id = "numpy.basic-linear-algebra"
domain = "numpy"
label = "Perform basic linear algebra with NumPy"
description = "Perform a basic matrix or vector operation and interpret compatible dimensions and the result."
assessment_examples = ["Multiply two compatible matrices and explain the result's shape."]

[[competencies]]
id = "pandas.read-tabular-data"
domain = "pandas"
label = "Read tabular data with pandas"
description = "Load a small tabular data file into a pandas DataFrame and inspect its structure."
assessment_examples = ["Load a CSV file and inspect its columns and first rows."]

[[competencies]]
id = "pandas.select-rows-and-columns"
domain = "pandas"
label = "Select pandas rows and columns"
description = "Select specified rows or columns from a pandas DataFrame and inspect the result."
assessment_examples = ["Select two named columns and rows satisfying a simple condition."]

[[competencies]]
id = "matplotlib.create-basic-plots"
domain = "matplotlib"
label = "Create basic Matplotlib plots"
description = "Create a line or scatter plot with meaningful axis labels."
