[[competencies]]
id = "slurm.monitor-job"
domain = "slurm"
label = "Monitor a Slurm job"
description = "Inspect a Slurm job and interpret whether it is queued, running, completed, or failed."
assessment_examples = ["Check a submitted job's state and locate its output or error file."]

[[competencies]]
id = "slurm.interpret-resource-requests"
domain = "slurm"
label = "Interpret Slurm resource requests"
description = "Identify requested wall time, CPUs, memory, partition, and account in a Slurm job specification."
