schema_version = 1
id = "training-competencies"
title = "Training catalog competencies"
status = "draft"
description = """
A controlled registry of concrete abilities that trainings in the catalog can
require or provide. Broad experience claims, delivery requirements, and
proficiency levels are intentionally outside the scope of this draft.
"""

[[domains]]
id = "programming"
label = "Language-independent programming"

[[domains]]
id = "command-line"
label = "Command-line use"

[[domains]]
id = "shell"
label = "Shell workflows"

